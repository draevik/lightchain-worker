# Every pull request: build, lint and test the worker, then build its image. A push to testnet also publishes the
# image as ghcr.io/lightchain-protocol/worker, tagged with the branch and the commit.
#
# The worker builds only beside the shared package, so both jobs lay the two repositories out the way the Dockerfile
# expects: worker/ and pkg/ under one root.
name: CI

on:
  pull_request:
  push:
    branches: [testnet]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      # Two commits deep, so the lint step can compare with the commit before this one.
      - &checkout
        uses: actions/checkout@v7
        with:
          path: worker
          fetch-depth: 2
          persist-credentials: false

      # The shared package at the branch this build is for: the pull request's target, or the pushed branch. There is
      # no fallback to another branch, so a build never runs against a package it was not meant for.
      - &pkg
        name: Check out the shared package
        working-directory: ${{ github.workspace }}
        run: |
          git clone --quiet --depth 1 --branch "${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" \
            https://github.com/lightchain-protocol/lightchain-shared-pkg pkg
          echo "pkg at $(git -C pkg rev-parse --abbrev-ref HEAD) $(git -C pkg rev-parse --short HEAD)"

      - uses: actions/setup-go@v7
        with:
          go-version-file: worker/go.mod
          cache-dependency-path: worker/go.sum

      - name: Join worker and pkg in a Go workspace
        working-directory: ${{ github.workspace }}
        run: go work init worker pkg

      - run: go build ./...

      # New issues only: those on lines changed since the previous commit, which for a pull request is the branch it
      # merges into. The findings the code already had do not fail the check.
      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: worker
          args: --new-from-rev=HEAD~

      - run: go test ./...

      - run: make test-install

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # One build at a time per branch, in the order the pushes arrived, so the branch tag cannot end on an older commit.
    concurrency: image-${{ github.ref }}
    steps:
      - *checkout
      - *pkg

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lightchain-protocol/worker
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      # A pull request builds the image and throws it away; only a push publishes it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: worker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
